{% extends "FotLiYa/base.html" %}

{% block title %}Rebutjar pregunta{% endblock %}

{% block content %}
<div class="card">
    <h1>Rebutjar pregunta</h1>

    <p><strong>Categoria:</strong> {{ proposed_question.category }}</p>
    <p><strong>Text:</strong> {{ proposed_question.text }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Confirmar rebuig</button>
        <a class="btn btn-secondary" href="{% url 'admin_questions' %}">Cancel·lar</a>
    </form>
</div>
{% endblock %}
