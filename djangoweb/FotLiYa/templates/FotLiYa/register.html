{% extends "FotLiYa/base.html" %}

{% block content %}
<div class="card">
    <h2>🎉 Crear compte</h2>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <input
                    type="{{ field.field.widget.input_type }}"
                    name="{{ field.html_name }}"
                    placeholder="{{ field.label }}"
                    {% if field.value %}value="{{ field.value }}"{% endif %}
                >
                {% for error in field.errors %}
                    <p style="color:#ff4d4d; font-size:0.85em;">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <button class="btn btn-primary" type="submit">Crear compte 🚀</button>
    </form>

    <p style="margin-top:12px; text-align:center;">
        Ja tens compte? <a href="{% url 'login' %}">Inicia sessió</a>
    </p>
</div>
{% endblock %}
