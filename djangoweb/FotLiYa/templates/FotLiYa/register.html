{% extends "FotLiYa/base.html" %}

{% block content %}
<div class="card">
    <h2>🎉 Crear compte</h2>

    {% if error %}
        <p style="color:#ff4d4d; font-weight:bold;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Crear compte 🚀</button>
</form>
</div>
{% endblock %}
