<!DOCTYPE html>
<html>
<head>
    <title>FotLiYa - Setup</title>

    <style>
        body { font-family: Arial; background:#f5f5f5; text-align:center; }
        .card { background:white; padding:30px; margin:50px auto; width:300px; border-radius:12px; }
        input, button { padding:10px; margin:10px; width:90%; }
    </style>

    <script>
        function generateInputs() {
            let num = document.getElementById("num_players").value;
            let container = document.getElementById("players");

            container.innerHTML = "";

            for (let i = 0; i < num; i++) {
                container.innerHTML +=
                    "<input name='player_" + i + "' placeholder='Jugador " + (i+1) + "' required>";
            }
        }
    </script>
</head>

<body>

<div class="card">
    <h2>🎮 FotLiYa</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="number" id="num_players" name="num_players"
               placeholder="Quants jugadors?" min="1" max="20"
               oninput="generateInputs()" required>

        <div id="players"></div>

        <button type="submit">🔥 FotLiYa</button>
    </form>
</div>

</body>
</html>
