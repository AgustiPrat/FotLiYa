{% extends "FotLiYa/base.html" %}

{% block content %}

<h2>Login</h2>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Usuari">
    <input type="password" name="password" placeholder="Contrasenya">

    <button class="btn" type="submit">Entrar</button>
</form>

{% endblock %}
