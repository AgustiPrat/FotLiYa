<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FotLiYa{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --pink:#ff2d75;
            --purple:#7c3aed;
            --orange:#ff8a00;
            --cyan:#00f5d4;
            --glass: rgba(255,255,255,0.14);
            --glass-border: rgba(255,255,255,0.22);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at top left, rgba(255,45,117,0.45), transparent 30%),
                radial-gradient(circle at top right, rgba(0,245,212,0.25), transparent 28%),
                linear-gradient(135deg, #12001f 0%, #2b0053 45%, #0d0d18 100%);
            overflow-x: hidden;
        }

        .blob {
            position: fixed;
            inset: auto;
            width: 320px;
            height: 320px;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: float 10s ease-in-out infinite;
        }

        .blob.one { top: -80px; left: -80px; background: var(--pink); }
        .blob.two { top: 120px; right: -120px; background: var(--cyan); animation-delay: 1.5s; }
        .blob.three { bottom: -120px; left: 35%; background: var(--purple); animation-delay: 3s; }

        @keyframes float {
            0%,100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-25px) scale(1.08); }
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: rgba(10, 10, 20, 0.45);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.10);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .brand a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .nav-links a, .nav-links span {
            color: rgba(255,255,255,0.92);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .nav-pill {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }

        .card {
            width: min(100%, 560px);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            padding: 34px;
            animation: pop 0.6s ease both;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(18px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1, h2, h3 {
            margin: 0 0 12px;
            line-height: 1.05;
        }

        p {
            margin: 0 0 14px;
            color: rgba(255,255,255,0.86);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: 0;
            border-radius: 16px;
            outline: none;
            font: inherit;
            background: rgba(255,255,255,0.95);
            color: #111;
        }

        button, .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 16px;
            padding: 13px 18px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), #8affd5);
            color: #111;
            box-shadow: 0 12px 28px rgba(0,245,212,0.20);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.14);
            color: white;
            border: 1px solid rgba(255,255,255,0.18);
        }

        button:hover, .btn:hover {
            transform: translateY(-1px) scale(1.01);
            filter: brightness(1.03);
        }

        .error {
            color: #ffd2e3;
            background: rgba(255,45,117,0.18);
            border: 1px solid rgba(255,45,117,0.28);
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 14px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0 16px;
        }

        .chip {
            padding: 9px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.16);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>

    <nav>
        <div class="brand">
            <a href="{% url 'home' %}">🎉 FotLiYa</a>
        </div>

        <div class="nav-links">
            {% if user.is_authenticated %}
                <span class="nav-pill">👤 {{ user.username }}</span>
                <a class="nav-pill" href="{% url 'logout_confirm' %}">Logout</a>
            {% else %}
                <a class="nav-pill" href="{% url 'login' %}">Login</a>
                <a class="nav-pill" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
