<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FotLiYa{% endblock %}</title>

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Estils -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        /* NAVBAR */
        nav {
            background: #6C63FF;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: white;
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        nav a:hover {
            opacity: 0.8;
        }

        /* CONTENIDOR */
        .container {
            padding: 40px;
            max-width: 1000px;
            margin: auto;
        }

        /* CARDS */
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* BOTONS */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #6C63FF;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
        }

        .btn:hover {
            background: #574fd6;
        }

        /* TITOLS */
        h1, h2, h3 {
            margin-bottom: 15px;
        }

        /* FORMULARIS */
        input, select {
            padding: 10px;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #777;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <h1>🎉 FotLiYa</h1>

    <div>
        <a href="/">Home</a>
        <a href="/games">Jocs</a>

        {% if user.is_authenticated %}
            <a href="/profile">Perfil</a>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </div>
</nav>

<!-- CONTINGUT -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 FotLiYa · Projecte UdL</p>
</footer>

</body>
</html>
